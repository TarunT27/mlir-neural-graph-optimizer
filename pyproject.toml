[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlir-neural-graph-optimizer"
version = "0.1.0"
description = "Dependency-free MLIR-style neural graph optimizer and reference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tarun" }]
keywords = ["mlir", "compiler", "neural-network", "graph-optimization", "ssa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
ng-opt = "ngopt.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10.3",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ngopt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ngopt"]

[tool.coverage.run]
branch = true
source = ["ngopt"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
