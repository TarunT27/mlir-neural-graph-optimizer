name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/ngopt
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage combine
      - run: coverage report --fail-under=80
      - run: python -m compileall -q src
      - run: ng-opt demo --output-dir artifacts/demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: ng-opt --version
      - run: ng-opt validate examples/tiny_mlp.mlir --trials 10

  native-mlir:
    name: Native MLIR 22.1.6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang ninja-build
      - name: Build exact LLVM/MLIR toolchain
        run: |
          wget --https-only -O llvm-project-22.1.6.src.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/llvm-project-22.1.6.src.tar.xz
          echo "6e0b376a1f6d9873e7dfb09ae6e04b9c7024400f01733fa4c29be69d5c138bc2  llvm-project-22.1.6.src.tar.xz" | sha256sum --check
          tar -xf llvm-project-22.1.6.src.tar.xz
          cmake -S llvm-project-22.1.6.src/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF
          cmake --build llvm-build --parallel 2 --target \
            mlir-tblgen FileCheck MLIROptLib MLIRArithDialect MLIRFuncDialect \
            MLIRLinalgDialect MLIRTensorDialect MLIRTransforms
      - name: Install Python reference package
        run: python -m pip install -e .
      - name: Configure native dialect
        run: |
          cmake -S native_mlir -B native_mlir/build -G Ninja \
            -DMLIR_DIR=${{ github.workspace }}/llvm-build/lib/cmake/mlir \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build and run native FileCheck suite
        run: cmake --build native_mlir/build --target check-ng --parallel 2
      - name: Verify Python-to-native end-to-end bridge
        run: |
          ng-opt native-export examples/tiny_mlp.mlir --optimize -o native-example.mlir
          native_mlir/build/bin/ngopt-native-opt \
            --convert-ng-to-linalg native-example.mlir -o native-lowered.mlir
          test -s native-lowered.mlir
          if grep -q "ng\." native-lowered.mlir; then exit 1; fi
